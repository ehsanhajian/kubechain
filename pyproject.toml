[project]
name = "kubechain"
version = "0.2.0"
description = "Decide whether a blockchain workload on Kubernetes is production ready."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "kubernetes",
  "ethereum",
  "geth",
  "lighthouse",
  "statefulset",
  "node",
  "cli",
]
authors = [{ name = "ehsanhajian" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Clustering",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "kubernetes>=31",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://ehsanhajian.github.io/kubechain/"
Repository = "https://github.com/ehsanhajian/kubechain"
Issues = "https://github.com/ehsanhajian/kubechain/issues"
Changelog = "https://github.com/ehsanhajian/kubechain/releases"

[project.scripts]
kubechain = "kubechain.cli:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubechain = ["clients.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
