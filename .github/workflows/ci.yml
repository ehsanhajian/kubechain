name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Fixtures
        run: |
          kubechain --version
          kubechain check --manifests examples/ready
          status=0
          kubechain check --manifests examples/broken || status=$?
          test "$status" -eq 2
      - name: Build
        if: matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          kubechain --version
